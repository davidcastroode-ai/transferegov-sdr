name: Capas das cartilhas MAPA
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq install -y poppler-utils >/dev/null
      - run: |
          mkdir out && cd out
          B=https://www.gov.br/agricultura/pt-br/centrais-de-conteudo/publicacoes/cartilhas-emendas-parlamentares
          pega(){ n=$1; shift; for u in "$@"; do curl -sL -A "Mozilla/5.0" "$u" -o t.pdf; if head -c 4 t.pdf | grep -q "%PDF"; then pdftoppm -f 1 -l 1 -jpeg -scale-to 900 t.pdf $n && mv $n-*.jpg $n.jpg && echo "$n ok $u" >> log.txt && return; fi; done; echo "$n FALHOU" >> log.txt; }
          pega portfolio $B/PLOA2025versofinal.pdf $B/PLOA2025versofinal.pdf/@@download/file $B/PLOA2025v4.pdf
          pega capacitacao $B/cartilha-capacitacao-e-eventos/@@download/file $B/cartilha-capacitacao-e-eventos
          pega insumos $B/cartilhas-insumos/@@download/file $B/cartilhas-insumos
          pega obras $B/cartilha-obras-de-fomento/@@download/file $B/cartilha-obras-de-fomento
          pega fotovoltaica $B/energia-fotovoltaica-para-o-desenvolvimento-rural/@@download/file $B/energia-fotovoltaica-para-o-desenvolvimento-rural
          pega hortas $B/cartilhas-hortas-comunitarias/@@download/file $B/cartilhas-hortas-comunitarias
          pega promaq $B/cartilha-promaq.pdf $B/cartilha-promaq.pdf/@@download/file
          pega proner $B/proner/@@download/file $B/proner
          pega te0ec2 $B/CartilhaTransfernciasEspeciaisAo0EC2.pdf $B/CartilhaTransfernciasEspeciaisAo0EC2.pdf/@@download/file
          pega tutorial $B/passo_a_passo_cadastro_nova_gestao_tranferencias_voluntarias.pdf $B/passo_a_passo_cadastro_nova_gestao_tranferencias_voluntarias.pdf/@@download/file
          curl -sL -A "Mozilla/5.0" "https://www.embrapa.br/busca-de-publicacoes/-/publicacao/1167976/catalogo-de-projetos-embrapa-emendas-parlamentares" | grep -o 'https://[^"]*\.pdf[^"]*' | head -3 > embrapa_links.txt || true
          L=$(head -1 embrapa_links.txt); [ -n "$L" ] && pega embrapa "$L" || true
          rm -f t.pdf
          git init -q && git checkout -q -b capas
          git config user.name robo && git config user.email robo@users.noreply.github.com
          git add -A && git commit -q -m capas
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" capas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
