name: Diag Emendas
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir diag && cd diag
          curl -sL -A "Mozilla/5.0" "https://portaldatransparencia.gov.br/download-de-dados/emendas-parlamentares/UNICO" -o em.zip -w "%{http_code} %{size_download}\n" > portal_status.txt
          (unzip -o em.zip && ls -la > arquivos.txt) || true
          for f in *.csv; do iconv -f latin1 -t utf-8 "$f" | head -3 > "cab_$f.txt"; iconv -f latin1 -t utf-8 "$f" | grep -i "22000\|Agricultura" | head -40 > "mapa_$f.txt"; iconv -f latin1 -t utf-8 "$f" | wc -l > "linhas_$f.txt"; done
          rm -f *.zip *.csv
          curl -s -X POST "https://www.siop.planejamento.gov.br/modulo/impositivo/itens/api" -H "Content-Type: application/json" -d '{}' -w "\nHTTP %{http_code}\n" > siop_status.txt 2>&1 || true
          curl -s "https://www.siop.planejamento.gov.br/modulo/main/static/api-explorer.html" | head -c 3000 > siop_explorer.html || true
          git init -q && git checkout -q -b diag-emendas
          git config user.name robo && git config user.email robo@users.noreply.github.com
          git add -A && git commit -q -m diag
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" diag-emendas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
