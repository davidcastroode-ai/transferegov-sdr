name: Diag Base Contratos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir diag && cd diag
          curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyLjeoCobYSRx7o3tiZ7fvj4-FhvKnGiSVxoA8l6yD2CqfJsUidxWN00jLuFpBMrFL6MesSdYuWnrb/pub?gid=668450794&single=true&output=csv" -o pub.csv
          curl -sL "https://docs.google.com/spreadsheets/d/1wN4o5tNVG8bNNivLWs6_ExCG8DsgVrScL8ozZ16f9CM/gviz/tq?tqx=out:csv&gid=668450794" -o gviz.csv
          git init -q && git checkout -q -b diag-base
          git config user.name robo && git config user.email robo@users.noreply.github.com
          git add -A && git commit -q -m diag
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" diag-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
