name: Teste Transferegov
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Diagnóstico TED
        run: python scripts/diag_ted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: spec-ted, path: spec_ted.json, if-no-files-found: ignore}
