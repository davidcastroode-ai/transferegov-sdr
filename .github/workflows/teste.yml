name: Teste Transferegov
on: workflow_dispatch
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Robô TED (teste)
        run: python scripts/ted.py diag_saida && mkdir -p diag && cp -r diag_saida/ted/* diag/
      - name: Publicar na branch "diag"
        run: |
          cd diag && git init -q && git checkout -q -b diag
          git config user.name robo-transferegov && git config user.email robo-transferegov@users.noreply.github.com
          git add -A && git commit -q -m diag
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" diag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
