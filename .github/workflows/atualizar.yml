name: Atualizar dados Transferegov

on:
  schedule:
    - cron: '0 9,12,15,19 * * *'   # 06:00, 09:00, 12:00 e 16:00 (Brasília): os relatórios do Tesouro chegam por e-mail ao longo da manhã
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recuperar o histórico das obras (dia anterior)
        run: curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/historico_obras.csv" -o /tmp/historico_obras.csv || echo "sem histórico anterior"

      - name: Baixar e filtrar os dados da SDR
        run: python scripts/processar.py saida
        env:
          HIST_ANTERIOR: /tmp/historico_obras.csv

      - name: Base Celebração (Planilha Execução Parcerias SDR · UG 420013)
        continue-on-error: true
        run: python scripts/celebracao.py saida

      - name: TEDs (API pública de TED)
        continue-on-error: true
        run: python scripts/ted.py saida

      - name: TEDs · relatório do Tesouro Gerencial (abas publicadas da BASE TED)
        continue-on-error: true
        run: python scripts/ted_tesouro.py saida

      - name: Orçamento por ação (aba ORCAMENTO da BASE ORÇAMENTO SDR)
        continue-on-error: true
        run: python scripts/orcamento.py saida

      - name: Contratos.gov.br (API pública · 1x por dia, nas outras rodadas reaproveita)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p /tmp/ctr_ant
          for k in ctr emp fat his res arq; do curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/dados/contratos_api_$k.csv" -o /tmp/ctr_ant/contratos_api_$k.csv || true; done
          python scripts/contratos_api.py saida
        env:
          CONTRATOS_ANTERIOR: /tmp/ctr_ant

      - name: Gerar as páginas do painel (Propostas, Empenho, Programas, Movimentação, Obras, Prestação de contas)
        run: python scripts/paginas.py saida

      - name: Publicar na branch "dados"
        run: |
          cd saida
          date -u '+%Y%m%d%H%M%S' > versao.txt
          for f in *; do echo "::notice title=$f::$(du -h "$f" | cut -f1)"; done
          git init -q
          git checkout -q -b dados
          git config user.name  "robo-transferegov"
          git config user.email "robo-transferegov@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados do Transferegov · $(date -u -d '-3 hours' '+%d/%m/%Y %H:%M')"
          if ! saida_push=$(git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dados 2>&1); then
            echo "::error title=Falha ao publicar::$(echo "$saida_push" | tr '\n' ' ' | sed "s/${GH_TOKEN}/***/g" | tail -c 900)"
            exit 1
          fi
          echo "::notice title=Publicado::https://github.com/${{ github.repository }}/tree/dados"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
