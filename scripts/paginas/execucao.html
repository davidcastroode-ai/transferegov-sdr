<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instrumentos vigentes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">__CSS__
<style>
.grp{font-size:12px;font-weight:700;color:#1f4e79;text-transform:uppercase;letter-spacing:.6px;margin:2px 0 6px 2px}
.kp.k4{grid-template-columns:repeat(4,1fr)}.kp.k6{grid-template-columns:repeat(6,1fr)}@media(max-width:900px){.kp.k4,.kp.k6{grid-template-columns:1fr 1fr}}
.k b.s{font-size:20px}.k.amar b{color:#b7860b}.k.verde b{color:#2e8a57}
.hb{grid-template-columns:minmax(150px,44%) 1fr 78px 36px}.hb .hbr{white-space:normal;line-height:1.2;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fg .tag{display:inline-block;width:auto}.mini{width:100%;font-size:11.5px;margin-top:4px}.mini th{background:#3a6f9f;padding:4px 6px}.mini td{padding:4px 6px}
.bx{display:flex;gap:6px;align-items:flex-end;height:180px;padding-top:18px}.bx>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border-radius:6px}.bx>div:hover,.bx>div.sel{background:#e3edf7}
.bx i{width:60%;max-width:46px;border-radius:4px 4px 0 0;display:block}.bx small{font-size:11px;color:#4a5a66;margin-top:3px;text-align:center}.bx em{font-style:normal;font-size:11px;font-weight:700;color:#1f4e79}
.pend{font-size:12px;color:#a04000}
</style></head><body>
<div class="wrap">
<div class="nota" id="nota"></div>
<section class="card"><div class="filtros" id="filtros"></div><button class="btn" id="limpar">Limpar filtros</button> <span id="contagem" style="font-size:13px;color:#66727c;margin-left:12px"></span></section>
<div id="corpo"></div>
<section class="card"><h3>Detalhamento dos instrumentos</h3><p class="d">clique na linha para abrir a ficha</p><input class="busca" id="busca" placeholder="Buscar nº, proponente, município, parlamentar, objeto…"><div id="lista"></div></section>
</div>
<script>__MAPA__
const ABA = '__ABA__';
const P = __DADOS__, D = P.linhas, ANO = P.meta.ano;
const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const RPN = {'2':'RP 2 · Discricionária','6':'RP 6 · Emenda individual','7':'RP 7 · Emenda de bancada','8':'RP 8 · Emenda de comissão','9':'RP 9 · Emenda de relator','3':'RP 3 · PAC'};
D.forEach(o => {
  o.rpN = RPN[o.rp] || (o.rp ? 'RP '+o.rp : 'Não informado');
  o.fx = o.dv===null ? '(sem data)' : o.dv<0 ? 'Vencida' : o.dv<=30 ? 'Até 30 dias' : o.dv<=60 ? '31 a 60 dias' : o.dv<=90 ? '61 a 90 dias' : o.dv<=180 ? '91 a 180 dias' : o.dv<=365 ? '181 a 365 dias' : 'Mais de 1 ano';
  o.fxD = o.dsd===null ? 'Sem desembolso' : o.dsd<=90 ? 'Até 90 dias' : o.dsd<=180 ? '91 a 180 dias' : o.dsd<=365 ? '181 a 365 dias' : 'Mais de 365 dias';
  o.fxP = o.dsp===null ? 'Sem pagamento' : o.dsp<=30 ? 'Até 30 dias' : o.dsp<=90 ? '31 a 90 dias' : o.dsp<=180 ? '91 a 180 dias' : o.dsp<=365 ? '181 a 365 dias' : 'Mais de 365 dias';
  o.sE = null; o.sR = null; o.pS = null; o.tes = {};
  // transferência de saldo (NS SALDO): a nota nova (UG de destino) é cópia de uma nota antiga (mesmo valor e data).
  // O saldo vale só na nota nova; o da antiga não soma (senão o saldo e o empenho aparecem em dobro).
  o.origemTransf = new Set();
  o.nes.filter(x => x[5]).forEach(c => { const orig = o.nes.find(x => !x[5] && x[1]!==c[1] && x[2]===c[2] && Math.abs((x[3]||0)-(c[3]||0)) < 1 && !o.origemTransf.has(x[1]+'|'+x[0])); if(orig) o.origemTransf.add(orig[1]+'|'+orig[0]); });
  o.sobra = 0; estimarEmp(o);
});
const FX_V = ['Vencida','Até 30 dias','31 a 60 dias','61 a 90 dias','91 a 180 dias','181 a 365 dias','Mais de 1 ano'];
const FX_D = ['Até 90 dias','91 a 180 dias','181 a 365 dias','Mais de 365 dias','Sem desembolso'];
const FX_P = ['Até 30 dias','31 a 90 dias','91 a 180 dias','181 a 365 dias','Mais de 365 dias','Sem pagamento'];
const FIL = [['parl','Parlamentar'],['ano','Ano da proposta'],['anoAss','Ano de assinatura'],['mod','Modalidade'],['sit','Situação do instrumento'],
  ['uf','UF'],['ug','UG executora'],['prog','Programa'],['acao','Ação orçamentária'],['rpN','Resultado primário'],
  ['tp','Tipo de parlamentar'],['nj','Natureza jurídica'],['objr','Objeto resumido'],['fx','Vencimento da vigência'],['prop','Proponente'],['munN','Município']];
const SEL = {sit:'Em execução'};
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm = v => { const a = Math.abs(v||0), s = v<0?'−':''; return s+(a>=1e9 ? (a/1e9).toFixed(2).replace('.',',')+' Bi' : a>=1e6 ? (a/1e6).toFixed(2).replace('.',',')+' Mi' : (a/1e3).toFixed(1).replace('.',',')+' Mil'); };
const R$ = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (a,b) => b ? (a/b*100).toFixed(1).replace('.',',')+'%' : '—';
const soma = (L,k) => L.reduce((a,o) => a+(o[k]||0), 0);
const n = x => Number(x||0).toLocaleString('pt-BR');
function filtrar(exceto){ return D.filter(o => FIL.every(([k]) => k===exceto || !SEL[k] || String(o[k])===SEL[k])); }
function desenharFiltros(){
  document.getElementById('filtros').innerHTML = FIL.map(([k,nm]) => {
    const vals = [...new Set(filtrar(k).map(o => String(o[k])))].sort((a,b) => /ano/.test(k) ? b.localeCompare(a) : a.localeCompare(b,'pt'));
    return `<label><span>${nm}</span><select data-k="${k}" class="${SEL[k]?'ativo':''}"><option value="">Todos</option>${vals.slice(0,1500).map(v => `<option value="${esc(v)}" ${SEL[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`; }).join('');
}
// barras horizontais: lista [[rótulo, valor, campo-filtro?]]; fmt para o número
function hbar(lista, campo, cor, fmt, tot){
  const mx = Math.max(1,...lista.map(x => Math.abs(x[1])));
  return lista.map(([k,v],i) => `<div class="hb ${campo && ehSel(campo,k)?'sel':''}" ${campo?`data-k="${campo}" data-v="${esc(k)}"`:''} title="${esc(k)}"><span class="hbr">${esc(k)}</span><div><i style="width:${Math.abs(v)/mx*100}%;background:${typeof cor==='function'?cor(k,i):cor}"></i></div><b>${fmt?fmt(v):n(v)}</b><em>${tot?Math.round(v/tot*100)+'%':''}</em></div>`).join('');
}
function colunas(lista, campo, cor, fmt){
  const mx = Math.max(1,...lista.map(x => x[1]));
  return `<div class="bx">${lista.map(([k,v,c2]) => `<div class="${campo && ehSel(campo,k)?'sel':''}" ${campo?`data-k="${campo}" data-v="${esc(k)}"`:''} title="${esc(k)}: ${fmt?fmt(v):n(v)}"><em>${fmt?fmt(v):n(v)}</em><i style="height:${Math.max(2,v/mx*100)}%;background:${c2||cor}"></i><small>${esc(k)}</small></div>`).join('')}</div>`;
}
const agrupar = (L, k, val) => { const m = {}; L.forEach(o => { const c = o[k]; m[c] = (m[c]||0) + (val ? val(o) : 1); }); return Object.entries(m).sort((a,b) => b[1]-a[1]); };
const sec = (tit, desc, corpo, cls) => `<section class="card ${cls||''}"><h3>${tit}</h3><p class="d">${desc}</p>${corpo}</section>`;
const kpi = (rot, val, sub, cls, def) => { let a = '';
  if(def){ const ch = ABA+'|'+rot; (window.KPI_DEF||(window.KPI_DEF={}))[ch] = {tit: rot, lista: def.l.slice().sort(def.s || (() => 0)), cols: [['Instrumento',o=>`<b>${esc(o.n)}</b><small>${esc(o.sit)}</small>`],['Convenente / local',objLoc]].concat(def.c || [])}; a = ` data-kpi="${esc(ch)}"`; }
  return `<div class="k ${cls||''}"${a}><span>${rot}</span><b>${val}</b><small>${sub||''}</small></div>`; };
let MUN = null;
function mapa(L, corPt){
  if(!MUN){ MUN = new Map(); MUN_BR.split(';').forEach(l => { const [uf,nm,x,y] = l.split('|'); MUN.set(uf+'|'+nm,[+x,+y]); }); }
  const porUF = {}, pts = new Map();
  L.forEach(o => { porUF[o.uf] = (porUF[o.uf]||0)+1; const nm = (o.mun||'').replace(/['\-]/g,' ').replace(/\s+/g,' ').trim(); const c = MUN.get(o.uf+'|'+nm); if(!c) return;
    const p = pts.get(o.uf+nm) || {x:c[0],y:c[1],n:0,v:0,nome:o.munN,uf:o.uf,alerta:false}; p.n++; p.v += o.rep; if(corPt && corPt(o)) p.alerta = true; pts.set(o.uf+nm,p); });
  const mx = Math.max(1,...Object.values(porUF));
  const est = Object.entries(MAPA_BR.ufs).map(([uf,d]) => `<path class="uf ${ehSel('uf',uf)?'sel':''}" d="${d}" data-k="uf" data-v="${uf}" style="fill:${porUF[uf]?`color-mix(in srgb,#1f4e79 ${Math.round((.1+.6*Math.sqrt(porUF[uf]/mx))*100)}%,#eef1ee)`:'#eef1f4'}"><title>${uf}: ${porUF[uf]||0} instrumentos</title></path>`).join('');
  const rot = Object.entries(MAPA_BR.centro).map(([uf,[x,y]]) => `<text class="rot" x="${x}" y="${y}">${uf}</text>`).join('');
  const ps = [...pts.values()].sort((a,b) => b.n-a.n).map(p => `<circle class="pt" cx="${p.x}" cy="${p.y}" r="${(2.2+1.3*Math.sqrt(p.n)).toFixed(1)}" fill="${p.alerta?'#c0392b':'#2e8a57'}"><title>${p.nome}/${p.uf}: ${p.n} instrumento(s) · repasse ${fm(p.v)}</title></circle>`).join('');
  return `<div class="mapa"><svg viewBox="0 0 ${MAPA_BR.w} ${MAPA_BR.h}">${est}${rot}${ps}</svg></div>`;
}
// Tesouro (EXE/RAP do painel): saldo de cada nota de empenho
let TES = null;
// empenhado do instrumento = soma das notas de empenho (para cada nota vale o maior valor entre Transferegov e Tesouro);
// nunca menor que desembolsado + saldo das notas no Tesouro (o que já foi pago saiu de algum empenho).
// O Transferegov traz muitas notas com valor 0, por isso o "valor empenhado" dele sozinho não serve.
function estimarEmp(o){
  // a nota gerada pela transferência de saldo (NS SALDO, ex.: 135098 → 130141) é o MESMO empenho mudando de UG: não soma de novo
  const porNE = new Map(); o.nes.forEach(([ne, ug, , v, , nsSaldo]) => { if(nsSaldo) return; const k = ug+'|'+ne; porNE.set(k, Math.max(porNE.get(k)||0, v||0)); });
  let soma = 0; porNE.forEach((v, k) => { const t = o.tes[k]; const vt = t ? Math.max(t.exe ? t.exe.emp : 0, t.rap ? (t.rap.emp||0) : 0) : 0; soma += Math.max(v, vt); });
  o.empNE = soma; o.empPiso = o.des + (o.sE||0) + (o.sR||0); o.empEst = Math.max(soma, o.empPiso, 0);
  o.reforco = o.sit==='Em execução' && o.rep - o.empEst > 1 ? o.rep - o.empEst : 0;
  // empenho acima do repasse: se houve ajuste (redução do repasse, supressão em aditivo, ajuste de PT, global menor que o original) é saldo remanescente; senão, é problema
  o.excesso = Math.max(o.empEst - o.rep, o.sobra||0); if(o.excesso <= 1) o.excesso = 0;
  o.reducao = Math.max(o.reduRep||0, o.supTA||0, o.globOrig && o.glob ? o.globOrig - o.glob : 0);
  o.ajuste = o.reducao > 1 || o.nAjPT > 0;
  o.remanesc = o.excesso && o.ajuste ? o.excesso : 0; o.semAjuste = o.excesso && !o.ajuste ? o.excesso : 0;
}
async function lerTesouro(){
  try{ TES = await parent.__tgSiafiNE(); }catch(e){ TES = {erro: e.message || 'fora do painel'}; }
  if(TES && TES.mapa){
    D.forEach(o => { let sE = 0, sR = 0, pg = 0, ach = 0; o.tes = {};
      o.nes.forEach(([ne, ug]) => { const t = TES.mapa[ug+'|'+ne]; if(!t) return; ach++; o.tes[ug+'|'+ne] = t;
        const transf = o.origemTransf.has(ug+'|'+ne);   // nota antiga cujo saldo foi transferido: só o pago conta
        if(t.exe){ if(!transf) sE += t.exe.saldo; pg += t.exe.pago; } if(t.rap){ if(!transf) sR += t.rap.saldo; pg += t.rap.pago; } });
      o.sE = sE; o.sR = sR; o.pS = pg; o.nAch = ach; estimarEmp(o);
      const s = sE + sR, falta = o.sit==='Em execução' ? o.aDes - s : -s;
      o.sobra = falta < -1 ? -falta : 0; estimarEmp(o); o.semSaldo = o.sit==='Em execução' && !o.reforco && falta > 1 ? falta : 0; });
  }
  render();
}
const ABERTO = new Set(), PAG = {};
function ficha(o){
  const linhaNE = ([ne, ug, data, valor, tipo, nsSaldo]) => { if(nsSaldo) tipo = (tipo||'')+' · nota da transferência de saldo (NS SALDO): o valor não soma de novo'; if(o.origemTransf.has(ug+'|'+ne)) tipo = (tipo||'')+' · saldo transferido para outra UG (o saldo desta nota não soma)'; const t = o.tes[ug+'|'+ne];
    const st = t ? [t.exe?`EXE: pago ${fm(t.exe.pago)} · saldo ${fm(t.exe.saldo)}`:'', t.rap?`RAP: pago ${fm(t.rap.pago)} · saldo ${fm(t.rap.saldo)}`:''].filter(Boolean).join('<br>') : (TES && TES.mapa ? '<span style="color:#7b8790">fora das bases de '+ANO+'</span>' : '—');
    return `<tr><td>${esc(ne)}</td><td>${esc(ug)}</td><td>${esc(data)}</td><td>${esc(tipo)}</td><td class="n">${fm(valor)}</td><td>${st}</td></tr>`; };
  return `<div class="ficha"><h4>Instrumento ${esc(o.n)} · ${esc(o.prop)}</h4>
  <div class="fg">
   <div><span>Situação</span>${esc(o.sit)}</div><div><span>Modalidade</span>${esc(o.mod)}</div><div><span>Vigência até</span>${esc(o.fv)||'—'}${o.dv!==null?` (${o.dv<0?'vencida há '+(-o.dv):'faltam '+o.dv} dias)`:''}</div><div><span>UG · ação</span>${esc(o.ug)} · ${esc(o.acao)}</div>
   <div><span>Programa</span>${esc(o.prog)}</div><div><span>Parlamentar</span>${esc(o.parl)}${o.emd?' · emenda '+esc(o.emd):''}</div><div><span>Resultado primário</span>${esc(o.rpN)}</div><div><span>Local</span>${esc(o.munN)}/${esc(o.uf)}</div>
   <div><span>Repasse</span>${R$(o.rep)}</div><div><span>Desembolsado</span>${R$(o.des)} (${pct(o.des,o.rep)})</div><div><span>A desembolsar</span>${R$(o.aDes)}</div><div><span>Empenhado (soma das notas)</span>${R$(o.empEst)}<small>notas ${fm(o.empNE)} · desembolsado + saldo no Tesouro ${fm(o.empPiso)}</small></div>
   <div><span>Saldo de empenho no Tesouro</span>${o.sE===null?'—':R$(o.sE+o.sR)+`<small> EXE ${fm(o.sE)} · RAP ${fm(o.sR)}</small>`}</div><div><span>Reforço de empenho</span>${o.reforco?`<b style="color:#c0392b">falta empenhar ${R$(o.reforco)}</b><small>repasse ${fm(o.rep)} − empenhado ${fm(o.empEst)}</small>`:'✓ empenhado todo o repasse'}${o.sobra?`<small style="color:#b7860b">saldo no Tesouro ${fm(o.sobra)} acima do que falta repassar</small>`:''}${o.semSaldo?`<small style="color:#b7860b">saldo no Tesouro ${fm(o.semSaldo)} abaixo do que falta repassar: conferir a nota</small>`:''}</div><div><span>Ajuste de valor</span>${ajusteTxt(o)}${o.remanesc?`<small style="color:#b7860b">saldo remanescente ${fm(o.remanesc)}</small>`:''}${o.semAjuste?`<small style="color:#c0392b">empenho ${fm(o.semAjuste)} acima do repasse sem ajuste</small>`:''}</div><div><span>Pago a fornecedores</span>${R$(o.pg)} (${n(o.nPg)} pagamentos)</div><div><span>Saldo em conta</span>${R$(o.sc)}</div>
   <div><span>Último desembolso</span>${esc(o.ultd)||'—'}</div><div><span>Último pagamento</span>${esc(o.ultP)||'—'}</div><div><span>Devolvido</span>${R$(o.dt+o.dc)}</div><div><span>Valor de emendas</span>${o.vEm?R$(o.vEm):'—'}</div>
  </div>
  ${o.nes.length?`<div style="margin-top:10px;font-size:12px;font-weight:600">Notas de empenho (Transferegov) × Tesouro ${esc(TES&&TES.mes||'')}</div><table class="mini"><tr><th>Nota</th><th>UG</th><th>Emissão</th><th>Tipo</th><th class="n">Valor</th><th>No Tesouro</th></tr>${o.nes.map(linhaNE).join('')}</table>`:''}
  ${o.ems.length?`<div style="margin-top:10px;font-size:12px;font-weight:600">Emendas</div><table class="mini"><tr><th>Emenda</th><th>Parlamentar</th><th>Tipo</th><th>Impositiva</th><th class="n">Valor</th></tr>${o.ems.map(e => `<tr><td>${esc(e[0])}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td><td>${esc(e[4])}</td><td class="n">${fm(e[3])}</td></tr>`).join('')}</table>`:''}
  ${o.desAno.length?`<div style="margin-top:10px;font-size:12px;font-weight:600">Desembolsos em ${ANO}</div><table class="mini"><tr><th>Data</th><th>OB</th><th class="n">Valor</th></tr>${o.desAno.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[2])}</td><td class="n">${fm(x[1])}</td></tr>`).join('')}</table>`:''}
  ${o.pags.length?`<div style="margin-top:10px;font-size:12px;font-weight:600">Últimos pagamentos do convenente</div><table class="mini"><tr><th>Data</th><th>Fornecedor</th><th>Documento</th><th class="n">Valor</th></tr>${o.pags.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[3])} ${esc(x[4])}</td><td class="n">${fm(x[2])}</td></tr>`).join('')}</table>`:''}
  <div style="margin-top:8px;font-size:12.5px"><b>Objeto:</b> ${esc(o.obj)}</div>
  <div style="margin-top:8px"><a class="lk" href="${esc(o.link)}" target="_blank">Abrir no Transferegov ↗</a> <button type="button" class="btn" style="margin:0 0 0 8px;padding:5px 14px" data-fichacompleta="${esc(o.n)}">Ficha completa do instrumento ›</button></div></div>`;
}
function tabela(id, L, cols, porPag){
  const p = PAG[id]||0, ini = p*porPag, pg = L.slice(ini, ini+porPag), nc = cols.length;
  if(!L.length) return '<p class="d">nenhum instrumento neste recorte</p>';
  return `<table><tr>${cols.map(c => `<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr>${pg.map(o => `<tr class="lin ${ABERTO.has(id+o.n)?'aberto':''}" data-ab="${id+o.n}">${cols.map(c => `<td class="${c[2]||''}">${c[1](o)}</td>`).join('')}</tr>${ABERTO.has(id+o.n)?`<tr><td colspan="${nc}" style="padding:0">${ficha(o)}</td></tr>`:''}`).join('')}</table>
  ${L.length>porPag?`<div class="pag">${ini+1}–${Math.min(L.length,ini+porPag)} de ${n(L.length)} <button data-pg="${id}" data-d="-1" ${p?'':'disabled'}>‹</button><button data-pg="${id}" data-d="1" ${ini+porPag<L.length?'':'disabled'}>›</button></div>`:''}`;
}
const objLoc = o => `${esc(o.prop.length>48?o.prop.slice(0,48)+'…':o.prop)}<small>${esc(o.munN)}/${esc(o.uf)} · UG ${esc(o.ug)}</small>`;
const ajusteTxt = o => [o.reduRep>1 ? 'repasse reduzido em '+fm(o.reduRep)+' (proposta '+fm(o.repProp)+' → atual '+fm(o.rep)+')' : '', o.supTA>1 ? 'supressão em aditivo: '+fm(o.supTA) : '',
  o.globOrig && o.glob && o.globOrig-o.glob>1 ? 'valor global original '+fm(o.globOrig)+' → '+fm(o.glob) : '', o.nAjPT ? o.nAjPT+' ajuste(s) de PT'+(o.ultAjPT?' (último '+o.ultAjPT+')':'') : ''].filter(Boolean).join('<br>') || '<span style="color:#c0392b">nenhum</span>';
const tesOk = () => TES && TES.mapa;
const tesMsg = () => !TES ? '<span class="pend">lendo o Tesouro (EXE/RAP)…</span>' : TES.erro ? `<span class="pend">Tesouro indisponível (${esc(TES.erro)})</span>` : 'Tesouro '+esc(TES.mes);

// ------------------------------------------------------------- Empenho / Desembolso
function telaEmp(L){
  const ex = L.filter(o => o.sit==='Em execução');
  const sE = soma(L,'sE'), sR = soma(L,'sR'), ref = L.filter(o => o.reforco>0), rem = L.filter(o => o.remanesc>0), semAj = L.filter(o => o.semAjuste>0);
