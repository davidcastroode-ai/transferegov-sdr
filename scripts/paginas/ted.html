<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TED API</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">__CSS__
<style>
.fi{background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.1);overflow:hidden;margin:8px 4px 12px;text-align:left;white-space:normal}
.fcab{background:linear-gradient(120deg,#0f6b2c,#22a03a);color:#fff;padding:14px 18px;position:relative}.fcab small{opacity:.85;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.fcab h4{margin:2px 0 2px;font-size:23px;color:#fff}.fcab p{margin:0 0 8px;font-size:13.5px}.pl{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700;margin:2px 4px 2px 0;background:rgba(255,255,255,.22);color:#fff}.pl.az{background:#5b6eae}.pl.vm{background:#c0392b}
.cx{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.cx div{background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-size:11px}.cx b{display:block;font-size:13.5px}
.fa{position:absolute;right:14px;top:12px}.fa button{border:0;border-radius:8px;padding:6px 10px;background:rgba(255,255,255,.22);color:#fff;font:600 12px Barlow,sans-serif;cursor:pointer}
.fcorpo{padding:14px 18px 16px}.vl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.vl div{border-left:4px solid var(--c);background:#f7f9fb;border-radius:8px;padding:8px 12px}
.vl span,.vg span{display:block;font-size:11.5px;color:#6b7a86}.vl b{font-size:17px}
.br{margin:10px 0}.br div{display:flex;justify-content:space-between;font-size:12.5px}.br i{display:block;height:10px;background:#e6ebf0;border-radius:6px;overflow:hidden;margin-top:4px}.br em{display:block;height:100%;background:#2e8a57}
.vg{display:grid;grid-template-columns:1.2fr 1fr 1.3fr;gap:10px}.vg div{background:#f7f9fb;border-radius:8px;padding:8px 12px}.vg b{font-size:16px}.vg .vd b{color:#2e8a57}.vg .am b{color:#b7860b}.vg .vm b{color:#c0392b}
.fi .sb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#1f4e79;font-weight:700;border-bottom:2px solid #e3e8ee;padding-bottom:4px;margin:16px 0 8px}
.fi .obs{background:#fff8e1;border-radius:8px;padding:6px 10px;font-size:12.5px;margin:8px 0 0}.fi .obj{font-size:12.5px;margin:8px 0 0}
.fi details{margin-top:10px}.fi summary{cursor:pointer;font-weight:700;color:#1f4e79;font-size:12.5px}.fi .rolar{overflow:auto}
@media(max-width:760px){.cx,.vl{grid-template-columns:1fr 1fr}.vg{grid-template-columns:1fr}.fa{position:static;margin-top:8px}}
@media print{body.imp *{visibility:hidden}body.imp .fi.imp, body.imp .fi.imp *{visibility:visible}body.imp .fi.imp{position:absolute;left:0;top:0;width:100%;box-shadow:none}.fa{display:none}.fi details{display:block}}

.grp{font-size:12px;font-weight:700;color:#1f4e79;text-transform:uppercase;letter-spacing:.6px;margin:2px 0 6px 2px}
.kp.k4{grid-template-columns:repeat(4,1fr)}.kp.k6{grid-template-columns:repeat(6,1fr)}@media(max-width:900px){.kp.k4,.kp.k6{grid-template-columns:1fr 1fr}}
.k b.s{font-size:20px}.k.amar b{color:#b7860b}.k.verde b{color:#2e8a57}
.hb{grid-template-columns:minmax(150px,44%) 1fr 78px 36px}.hb .hbr{white-space:normal;line-height:1.2;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fg .tag{display:inline-block;width:auto}.mini{width:100%;font-size:11.5px;margin-top:4px}.mini th{background:#3a6f9f;padding:4px 6px}.mini td{padding:4px 6px;vertical-align:top}
.bx{display:flex;gap:6px;align-items:flex-end;height:180px;padding-top:18px}.bx>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border-radius:6px}.bx>div:hover,.bx>div.sel{background:#e3edf7}
.bx i{width:60%;max-width:46px;border-radius:4px 4px 0 0;display:block}.bx small{font-size:11px;color:#4a5a66;margin-top:3px;text-align:center}.bx em{font-style:normal;font-size:11px;font-weight:700;color:#1f4e79}
.rej{font-size:13px;color:#3a4a55;margin-left:14px;cursor:pointer}.rej input{vertical-align:middle}
.st,.fg .st{display:inline-block;width:auto;text-transform:none;letter-spacing:0;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.sub{margin-top:10px;font-size:12px;font-weight:600;text-align:left}.just{font-size:11.5px;color:#4a5a66}
</style></head><body>
<div class="wrap">
<div class="nota" id="nota"></div>
<section class="card"><div class="filtros" id="filtros"></div><button class="btn" id="limpar">Limpar filtros</button>
 <label class="rej"><input type="checkbox" id="rej"> incluir planos rejeitados</label>
 <span id="contagem" style="font-size:13px;color:#66727c;margin-left:12px"></span></section>
<div id="corpo"></div>
<section class="card"><h3>Detalhamento dos TEDs</h3><p class="d">clique na linha para abrir a ficha</p><input class="busca" id="busca" placeholder="Buscar nº TED, plano, unidade, objeto, SEI…"><div id="lista"></div></section>
</div>
<script>
const P = __DADOS__, D = P.linhas, ANO = P.ano;
const FASES = ['Em execução','Vigência vencida','Prestação de contas','Concluído','Em formalização','Só no Tesouro','Plano em análise','Plano rejeitado'];
const TES = P.tes || {};
const COR_F = {'Em execução':'#2e8a57','Vigência vencida':'#c0392b','Prestação de contas':'#b7860b','Concluído':'#1f4e79','Em formalização':'#6c5ce7','Plano em análise':'#7b8790','Plano rejeitado':'#b2bec3','Só no Tesouro':'#16a085'};
const SIT = {EM_EXECUCAO:'Em execução',CUMPRIMENTO_OBJETO_INICIADO:'Cumprimento do objeto iniciado',CUMPRIMENTO_OBJETO_ENVIADO_ANALISE:'Cumprimento do objeto em análise',
  CUMPRIMENTO_OBJETO_APROVADO:'Cumprimento do objeto aprovado',CUMPRIMENTO_OBJETO_APROVADO_COM_RESSALVAS:'Aprovado com ressalvas',PENDENTE_REGISTRO_NO_SIAFI:'Pendente de registro no SIAFI',
  EM_ELABORACAO:'Em elaboração',ENVIADO:'Enviado',APROVADO:'Aprovado',REJEITADO:'Rejeitado',ENVIADO_ANALISE:'Enviado para análise',ANALISE_APROVADA:'Análise aprovada',EM_ANALISE:'Em análise',EM_COMPLEMENTACAO:'Em complementação'};
const sitN = s => SIT[s] || String(s||'').replace(/_/g,' ').toLowerCase().replace(/^./, c => c.toUpperCase());
const UGN = {'420013':'420013 · SDR','130141':'130141','130010':'130010','130255':'130255','135098':'135098'};
D.forEach(o => {
  o.rpN = o.rp ? [...new Set(o.rp.split(' | '))].join(' + ') : 'Não informado';
  o.fx = o.dias===null ? '(sem vigência)' : o.dias<0 ? 'Vencida' : o.dias<=30 ? 'Até 30 dias' : o.dias<=60 ? '31 a 60 dias' : o.dias<=90 ? '61 a 90 dias' : o.dias<=180 ? '91 a 180 dias' : o.dias<=365 ? '181 a 365 dias' : 'Mais de 1 ano';
  o.ugdN = UGN[o.ugd] || o.ugd; o.spN = sitN(o.sp); o.stN = o.st==='(sem termo)' ? '(sem termo)' : sitN(o.st);
  o.chave = o.n || 'PA '+o.cod;
});
const FX_V = ['Vencida','Até 30 dias','31 a 60 dias','61 a 90 dias','91 a 180 dias','181 a 365 dias','Mais de 1 ano'];
const FIL = [['ano','Ano do TED'],['fase','Fase'],['ugdN','UG descentralizadora'],['er','Enviado / recebido'],['orr','Órgão descentralizado'],
  ['unr','Unidade descentralizada'],['acao','Ação orçamentária'],['rpN','Resultado primário'],['stN','Situação do termo'],['fx','Vencimento da vigência'],['org','Origem (Tesouro × API)']];
const SEL = {};
function base(){ return document.getElementById('rej').checked ? D : D.filter(o => o.fase!=='Plano rejeitado'); }
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm = v => { const a = Math.abs(v||0), s = v<0?'−':''; return s+(a>=1e9 ? (a/1e9).toFixed(2).replace('.',',')+' Bi' : a>=1e6 ? (a/1e6).toFixed(2).replace('.',',')+' Mi' : (a/1e3).toFixed(1).replace('.',',')+' Mil'); };
const R$ = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const f2 = v => Math.abs(v||0) < 0.005 ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (a,b) => b ? (a/b*100).toFixed(1).replace('.',',')+'%' : '—';
const soma = (L,k) => L.reduce((a,o) => a+(o[k]||0), 0);
const n = x => Number(x||0).toLocaleString('pt-BR');
function filtrar(exceto){ return base().filter(o => FIL.every(([k]) => k===exceto || !SEL[k] || String(o[k])===SEL[k])); }
function desenharFiltros(){}
function hbar(lista, campo, cor, fmt, tot){
  const mx = Math.max(1,...lista.map(x => Math.abs(x[1])));
  return lista.map(([k,v],i) => `<div class="hb ${campo && ehSel(campo,k)?'sel':''}" ${campo?`data-k="${campo}" data-v="${esc(k)}"`:''} title="${esc(k)}"><span class="hbr">${esc(k)}</span><div><i style="width:${Math.abs(v)/mx*100}%;background:${typeof cor==='function'?cor(k,i):cor}"></i></div><b>${fmt?fmt(v):n(v)}</b><em>${tot?Math.round(v/tot*100)+'%':''}</em></div>`).join('') || '<p class="d">nada neste recorte</p>';
}
function colunas(lista, campo, cor, fmt){
  const mx = Math.max(1,...lista.map(x => x[1]));
  return `<div class="bx">${lista.map(([k,v,c2]) => `<div class="${campo && ehSel(campo,k)?'sel':''}" ${campo?`data-k="${campo}" data-v="${esc(k)}"`:''} title="${esc(k)}: ${fmt?fmt(v):n(v)}"><em>${fmt?fmt(v):n(v)}</em><i style="height:${Math.max(2,v/mx*100)}%;background:${c2||cor}"></i><small>${esc(k)}</small></div>`).join('')}</div>`;
}
const agrupar = (L, k, val) => { const m = {}; L.forEach(o => { const c = o[k]; m[c] = (m[c]||0) + (val ? val(o) : 1); }); return Object.entries(m).sort((a,b) => b[1]-a[1]); };
const sec = (tit, desc, corpo, cls) => `<section class="card ${cls||''}"><h3>${tit}</h3><p class="d">${desc}</p>${corpo}</section>`;
const tedId = o => `<b>${o.n?'TED '+esc(o.n):'Plano '+esc(o.cod)}</b><small>${o.n&&o.cod?'plano '+esc(o.cod)+' · ':''}${esc(o.ano)}${TES.carregado && o.org!=='Tesouro e API' && o.n ? ` · <span style="color:${o.org==='Só no Tesouro'?'#16a085':/diferentes/.test(o.org)?'#c0392b':'#b7860b'}">${esc(o.org)}</span>` : ''}</small>`;
const unid = o => `${esc(o.unr.length>52?o.unr.slice(0,52)+'…':o.unr)}<small>UG ${esc(o.ugr)} · ${esc(o.orr)}</small>`;
const faseTag = o => `<b class="st" style="background:${COR_F[o.fase]}">${esc(o.fase)}</b>`;
const kpi = (rot, val, sub, cls, def) => { let a = '';
  if(def){ const ch = 'ted|'+rot; (window.KPI_DEF||(window.KPI_DEF={}))[ch] = {tit: rot, lista: def.l.slice().sort(def.s || ((a,b) => b.fir-a.fir)),
    cols: [['TED',tedId],['Unidade descentralizada',unid],['Fase',faseTag]].concat(def.c || [['Firmado',o=>fm(o.fir),'n']])}; a = ` data-kpi="${esc(ch)}"`; }
  return `<div class="k ${cls||''}"${a}><span>${rot}</span><b>${val}</b><small>${sub||''}</small></div>`; };

const ABERTO = new Set(), PAG = {};
const mesN = m => ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][m]||'';
function ficha(o){
  const t = (cab, linhas) => `<div class="rolar"><table class="mini"><tr>${cab.map(c => `<th class="${/Valor|Qtd|Previsto|Repassado|Descentralizado|Empenhado|Liquidado|Pago/.test(c)?'n':''}">${c}</th>`).join('')}</tr>${linhas}</table></div>`;
  const T = o.tes || {}, comp = T.comp||0, aComp = T.aComp||0, pRep = o.fir ? o.pf/o.fir : 0, pComp = (comp+aComp) ? comp/(comp+aComp) : 0;
  const corD = o.dias===null ? '' : o.dias<0 ? 'vm' : o.dias<=90 ? 'am' : 'vd';
  const alerta = o.fase==='Em execução' && o.dias!==null && o.dias<=90 && o.ar>1 ? 'Vence em até 90 dias com valor a repassar' : o.fase==='Em execução' && o.dias!==null && o.dias<=90 ? 'Vence em até 90 dias' : o.fase==='Vigência vencida' ? 'Vigência vencida' : o.op>1 ? 'Orçamento pendente de descentralização' : '';
  // cronograma × repassado (acumulado)
  const hoje = new Date(), ym = hoje.getFullYear()*12 + hoje.getMonth()+1;
  let acP = 0; const cro = o.cro.map(c => { acP += c[2]; const cob = Math.min(c[2], Math.max(0, o.pf - (acP - c[2]))), venc = (+c[0])*12 + c[1] <= ym;
    return [c, cob, cob >= c[2]-1 ? ['✓ repassada','#2e8a57'] : venc ? ['faltam '+fm(c[2]-cob)+(cob?' (parcial)':'')+' · atrasada','#b7860b'] : [cob ? 'parcial · faltam '+fm(c[2]-cob) : 'a vencer','#6b7a86']]; });
  const nca = o.nca && o.nca.length ? o.nca : [];
  return `<div class="fi"><div class="fcab" style="--fc:${COR_F[o.fase]||'#1f4e79'}">
   <small>Termo de Execução Descentralizada · ${o.er==='Recebido'?'recebido pela':'enviado pela'} UG ${esc(o.er==='Recebido'?o.ugr:o.ugd)}</small>
   <h4>${o.n?'TED '+esc(o.n):'Plano de ação '+esc(o.cod)}</h4><p>${esc(o.unr)} · UG ${esc(o.ugr)}</p>
   <span class="pl" style="background:${COR_F[o.fase]}">● ${esc(o.fase)}</span>${o.org?`<span class="pl az">${esc(o.org)}</span>`:''}${o.emd?`<span class="pl">Emenda ${esc(o.emd)}</span>`:''}${alerta?`<span class="pl vm">⚠ ${alerta}</span>`:''}
   <div class="cx"><div>Ano<b>${esc(o.ano)}</b></div><div>Ação<b>${esc(o.acao)}</b></div><div>RP<b>${esc(o.rpN)}</b></div><div>Situação do termo<b>${esc(o.stN)}</b></div><div>Órgão<b>${esc(o.orr)}</b></div></div>
   <div class="fa"><button type="button" data-imp="${esc(o.id)}">🖨 Imprimir / PDF</button></div></div>
  <div class="fcorpo">
   <div class="vl"><div style="--c:#1f4e79"><span>Valor firmado</span><b>${R$(o.fir)}</b></div><div style="--c:#2e8a57"><span>Descentralizado (NC)</span><b>${R$(o.nc)}</b></div>
    <div style="--c:#5b6eae"><span>Repassado (PF)</span><b>${R$(o.pf)}</b></div><div style="--c:#b7860b"><span>A repassar${o.op>1?' · orç. pendente '+fm(o.op):''}</span><b>${R$(o.ar)}</b></div></div>
   <div class="br"><div><span>Execução do repasse</span><b>${pct(o.pf,o.fir)} repassado</b></div><i><em style="width:${Math.min(100,pRep*100).toFixed(1)}%"></em></i></div>
   ${o.tes?`<div class="br"><div><span>Comprovação (Tesouro)</span><b>${Math.round(pComp*100)}% comprovado · ${R$(aComp)} a comprovar</b></div><i><em style="width:${Math.min(100,pComp*100).toFixed(1)}%;background:#1e6b45"></em></i></div>`:''}
   <div class="vg"><div><span>Vigência</span><b>${esc(o.ini)||'—'} a ${esc(o.fim)||'—'}</b></div><div class="${corD}"><span>Dias a vencer</span><b>${o.dias===null?'—':o.dias<0?'vencida há '+(-o.dias)+' dias':o.dias+' dias'}</b></div>
    <div><span>Fim na API / ajuste da equipe</span><b style="font-size:13.5px">${o.aj&&o.aj[0]?esc(o.fimApi||'—')+' → '+esc(o.aj[0])+' (prorrogado)':esc(o.fimApi||o.fim||'—')+' · sem ajuste'}</b></div></div>
   ${o.aj&&o.aj[2]?`<p class="obs">Observação da equipe: ${esc(o.aj[2])}</p>`:''}
   <div class="sb">Identificação</div><div class="fg">
    <div><span>Processo SEI</span>${esc(o.sei)||'—'}</div><div><span>Plano de ação</span>${esc(o.cod)||'—'}</div><div><span>NS do termo</span>${esc(o.ns)||'—'}</div>
    <div><span>Descentralizadora</span>UG ${esc(o.ugd)} · ${esc(o.und)||''}</div><div><span>UG executora</span>${esc(o.uge)||'—'}</div><div><span>Assinatura</span>${esc(o.ass)||'—'}</div>
    <div><span>Programa</span>${esc(o.prog)||'—'}</div><div><span>Último parecer / análise</span>${esc(o.ult)||'—'}</div><div><span>Termo</span>${o.link?`<a href="${esc(o.link)}" target="_blank" rel="noopener">abrir no Transferegov</a>`:'—'}</div>
   </div>${o.obj?`<p class="obj"><b>Objeto:</b> ${esc(o.obj)}</p>`:''}
   ${nca.length?`<div class="sb">Ações usadas neste TED</div>${t(['Ação','PTRES','PI','Natureza','RP','Descentralizado'], nca.map(x => `<tr><td>${esc(x[0])||'—'}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td><td>${esc(x[4])}</td><td class="n">${f2(x[5])}</td></tr>`).join(''))}`:''}
   ${o.ncs.length?`<div class="sb">Orçamento · notas de crédito</div>${t(['Nota','Emissão','UG emitente → favorecida','PTRES · PI','Natureza','RP','Valor'], o.ncs.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])} → ${esc(x[3])}</td><td>${esc(x[5])} · ${esc(x[6])}</td><td>${esc(x[7])}</td><td>${esc(x[8])}</td><td class="n">${f2(x[4])}</td></tr>`).join(''))}`:''}
   ${o.pfs.length?`<div class="sb">Financeiro · programações financeiras</div>${t(['PF','Data','Situação','Observação','Valor'], o.pfs.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(sitN(x[5]))}</td><td class="just">${esc(x[6])}</td><td class="n">${f2(x[4])}</td></tr>`).join(''))}`:''}
   ${cro.length?`<div class="sb">Cronograma × repassado</div>${t(['Parcela','Previsto','Repassado','Situação'], cro.map(([c,cob,st]) => `<tr><td>${mesN(c[1])}/${esc(c[0])}</td><td class="n">${f2(c[2])}</td><td class="n">${f2(cob)}</td><td style="color:${st[1]}">${st[0]}</td></tr>`).join(''))}`:''}
   <div class="sb">Empenhos da unidade descentralizada</div><p class="obs" style="background:#f4f6f8;color:#6b7a86">Aguardando o relatório de empenhos do Tesouro Gerencial (aba TESOURO TED NE).</p>
   ${o.met.length?`<details><summary>Metas (${o.met.length})</summary>${t(['Meta','Descrição','Qtd','Período'], o.met.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td class="n">${esc(x[2])} ${esc(x[3])}</td><td>${esc(x[5])} a ${esc(x[6])}</td></tr>`).join(''))}</details>`:''}
   ${o.par.length?`<details><summary>Análises e pareceres (${o.par.length})</summary>${t(['Tipo','Resultado','Situação','Justificativa'], o.par.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(sitN(x[1]))||'—'}</td><td>${esc(sitN(x[2]))}</td><td class="just">${esc(x[3])}</td></tr>`).join(''))}</details>`:''}
   ${TES.carregado?`<details><summary>Tesouro Gerencial · contas e diferenças</summary>${fichaTes(o)}</details>`:''}
  </div></div>`;
}
function fichaTes(o){
  if(!TES.carregado) return '';
  if(!o.tes) return `<div class="sub">Tesouro Gerencial (SIAFI)</div><p class="just">${o.n?'TED '+esc(o.n)+' não aparece no relatório do Tesouro carregado.':'Plano ainda sem nº de TED: não tem como estar no Tesouro.'}</p>`;
  const t = o.tes, v = x => x===null||x===undefined ? '—' : R$(x);
  return `<div class="sub">Tesouro Gerencial (SIAFI) · relatório de ${esc(TES.gerado_em)}</div>
   <div class="fg" style="margin-top:4px"><div><span>A comprovar</span>${v(t.aComp)}</div><div><span>Comprovado</span>${v(t.comp)}</div><div><span>A repassar</span>${v(t.aRep)}</div><div><span>Repassado</span>${v(t.rep)}</div>
   <div><span>Descentralizado</span>${v(t.nc)}</div><div><span>Firmado</span>${v(t.fir)}</div><div><span>Devolvido / anulado</span>${v(t.dev)}</div><div><span>UG emitente → favorecida</span>${esc(t.ugE)||'—'} → ${esc(t.ugF)||'—'}</div></div>
   ${o.dif.length?`<table class="mini"><tr><th>Diferença</th><th class="n">API</th><th class="n">Tesouro</th><th class="n">Tesouro − API</th></tr>${o.dif.map(d => `<tr><td>${esc(d[0])}</td><td class="n">${fm(d[1])}</td><td class="n">${fm(d[2])}</td><td class="n" style="color:#c0392b">${fm(d[2]-d[1])}</td></tr>`).join('')}</table>`:''}
   ${t.contas.length?`<table class="mini"><tr><th>Conta / coluna do relatório</th><th class="n">Valor</th></tr>${t.contas.map(c => `<tr><td>${esc(c[0])}</td><td class="n">${R$(c[1])}</td></tr>`).join('')}</table>`:''}`;
}
function tabela(id, L, cols, porPag){
  const p = PAG[id]||0, ini = p*porPag, pg = L.slice(ini, ini+porPag), nc = cols.length;
  if(!L.length) return '<p class="d">nenhum TED neste recorte</p>';
  return `<table><tr>${cols.map(c => `<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr>${pg.map(o => `<tr class="lin ${ABERTO.has(id+o.id)?'aberto':''}" data-ab="${id+o.id}">${cols.map(c => `<td class="${c[2]||''}">${c[1](o)}</td>`).join('')}</tr>${ABERTO.has(id+o.id)?`<tr><td colspan="${nc}" style="padding:0">${ficha(o)}</td></tr>`:''}`).join('')}</table>
  ${L.length>porPag?`<div class="pag">${ini+1}–${Math.min(L.length,ini+porPag)} de ${n(L.length)} <button data-pg="${id}" data-d="-1" ${p?'':'disabled'}>‹</button><button data-pg="${id}" data-d="1" ${ini+porPag<L.length?'':'disabled'}>›</button></div>`:''}`;
}

function telaTED(L){
  const ted = L.filter(o => o.n), vig = L.filter(o => o.fase==='Em execução'), venc = L.filter(o => o.fase==='Vigência vencida'), pc = L.filter(o => o.fase==='Prestação de contas');
  const v90 = vig.filter(o => o.dias!==null && o.dias<=90), opd = L.filter(o => o.op>1), ard = L.filter(o => o.ar>1), anal = L.filter(o => o.fase==='Plano em análise' || o.fase==='Em formalização');
  const fir = soma(L,'fir');
  const kp1 = `<div class="grp">Valores</div><div class="kp k6">
    ${kpi('TEDs', n(ted.length), n(L.length)+' planos de ação no recorte', 'dest', {l: L})}
    ${kpi('Valor firmado', fm(fir), R$(fir), '', {l: L.filter(o => o.fir>0)})}
    ${kpi('Descentralizado (NC)', fm(soma(L,'nc')), pct(soma(L,'nc'),fir)+' do firmado', 'verde', {l: L.filter(o => o.nc>0), s:(a,b)=>b.nc-a.nc, c:[['Firmado',o=>fm(o.fir),'n'],['Descentralizado',o=>fm(o.nc),'n']]})}
    ${kpi('Orçamento pendente', fm(soma(L,'op')), n(opd.length)+' TEDs com crédito a descentralizar', 'amar', {l: opd, s:(a,b)=>b.op-a.op, c:[['Firmado',o=>fm(o.fir),'n'],['Pendente',o=>fm(o.op),'n']]})}
    ${kpi('Repassado (PF)', fm(soma(L,'pf')), pct(soma(L,'pf'),fir)+' do firmado', 'verde', {l: L.filter(o => o.pf>0), s:(a,b)=>b.pf-a.pf, c:[['Firmado',o=>fm(o.fir),'n'],['Repassado',o=>fm(o.pf),'n']]})}
    ${kpi('A repassar', fm(soma(L,'ar')), n(ard.length)+' TEDs com financeiro a repassar', 'amar', {l: ard, s:(a,b)=>b.ar-a.ar, c:[['Firmado',o=>fm(o.fir),'n'],['A repassar',o=>fm(o.ar),'n']]})}
  </div>`;
  const vcol = [['Fim da vigência',o=>esc(o.fim)+`<small>${o.dias===null?'':o.dias<0?'vencida há '+(-o.dias)+' d':'faltam '+o.dias+' d'}</small>`,'n'],['A repassar',o=>fm(o.ar),'n']];
  const kp2 = `<div class="grp">Acompanhamento</div><div class="kp k4">
    ${kpi('Em execução', n(vig.length), fm(soma(vig,'fir'))+' firmados', '', {l: vig, s:(a,b)=>a.dias-b.dias, c: vcol})}
    ${kpi('Vigência vence em 90 dias', n(v90.length), 'termos em execução', v90.length?'amar':'', {l: v90, s:(a,b)=>a.dias-b.dias, c: vcol})}
    ${kpi('Vigência vencida sem prestação', n(venc.length), 'termo ainda "em execução"', venc.length?'red':'', {l: venc, s:(a,b)=>a.dias-b.dias, c: vcol})}
    ${kpi('Em prestação de contas', n(pc.length), 'cumprimento do objeto iniciado ou em análise', '', {l: pc, c:[['Situação do termo',o=>esc(o.stN)],['Firmado',o=>fm(o.fir),'n']]})}
  </div>`;
  const tesL = L.filter(o => o.tes), so = L.filter(o => o.org==='Só no Tesouro'), dif = L.filter(o => o.dif && o.dif.length), soAPI = L.filter(o => o.org==='Só na API');
  const sT = k => tesL.reduce((a,o) => a+(o.tes[k]||0), 0);
  const kp3 = !TES.carregado ? `<div class="grp">Tesouro Gerencial (SIAFI)</div><div class="nota" style="background:#eef4fa;border-color:#b9c7d3">${TES.erros && TES.erros.length ? 'Não consegui ler o relatório do Tesouro: '+esc(TES.erros.join(' · ')) : 'O relatório do Tesouro ainda não foi ligado. Quando o link da aba estiver no robô, aparecem aqui: a comprovar, comprovado, TEDs que só estão no Tesouro e as diferenças entre Tesouro e API.'}</div>`
   : `<div class="grp">Tesouro Gerencial (SIAFI) · relatório de ${esc(TES.gerado_em)}</div><div class="kp k6">
    ${kpi('A comprovar (Tesouro)', fm(sT('aComp')), n(tesL.filter(o => o.tes.aComp>1).length)+' TEDs', 'amar', {l: tesL.filter(o => o.tes.aComp>1), s:(a,b)=>b.tes.aComp-a.tes.aComp, c:[['A comprovar',o=>fm(o.tes.aComp),'n']]})}
    ${kpi('Comprovado (Tesouro)', fm(sT('comp')), n(tesL.filter(o => o.tes.comp>1).length)+' TEDs', 'verde', {l: tesL.filter(o => o.tes.comp>1), s:(a,b)=>b.tes.comp-a.tes.comp, c:[['Comprovado',o=>fm(o.tes.comp),'n']]})}
    ${kpi('A repassar (Tesouro)', fm(sT('aRep')), n(tesL.filter(o => o.tes.aRep>1).length)+' TEDs', '', {l: tesL.filter(o => o.tes.aRep>1), s:(a,b)=>b.tes.aRep-a.tes.aRep, c:[['A repassar (Tesouro)',o=>fm(o.tes.aRep),'n'],['A repassar (API)',o=>fm(o.ar),'n']]})}
    ${kpi('Só no Tesouro', n(so.length), 'TEDs que a API não traz', so.length?'amar':'', {l: so})}
    ${kpi('Só na API', n(soAPI.length), 'TEDs com nº fora do relatório', '', {l: soAPI})}
    ${kpi('Valores diferentes', n(dif.length), 'Tesouro × API (NC, PF ou firmado)', dif.length?'red':'', {l: dif, c:[['Diferenças',o=>o.dif.map(d => esc(d[0])+': '+fm(d[2]-d[1])).join('<br>')]]})}
  </div>`;
  const porFase = FASES.map(f => [f, L.filter(o => o.fase===f).length]).filter(x => x[1]);
  const anos = [...new Set(L.map(o => o.ano))].sort();
  const porAno = anos.map(a => [a, soma(L.filter(o => o.ano===a),'fir')]);
  const vf = FX_V.map(f => [f, L.filter(o => o.fx===f && (o.fase==='Em execução' || o.fase==='Vigência vencida')).length, f==='Vencida'?'#c0392b':'#2e8a57']);
  return kp1 + kp2 + kp3 + `<div class="g2">
    ${sec('Por fase', 'quantidade de planos de ação · clique para filtrar', hbar(porFase, 'fase', k => COR_F[k], null, L.length))}
    ${sec('Valor firmado por ano', 'ano do TED · clique para filtrar', colunas(porAno, 'ano', '#1f4e79', fm))}
    ${sec('Por UG descentralizadora', 'valor firmado', hbar(agrupar(L,'ugdN',o=>o.fir), 'ugdN', '#3a6f9f', fm, fir))}
    ${sec('Vencimento da vigência', 'termos em execução (inclusive os vencidos)', colunas(vf, 'fx', '#2e8a57', null))}
    ${sec('Órgão descentralizado', 'para quem vai o recurso · valor firmado', hbar(agrupar(L,'orr',o=>o.fir).slice(0,10), 'orr', '#2e8a57', fm, fir))}
    ${sec('Unidades descentralizadas', 'as 12 maiores · valor firmado', hbar(agrupar(L,'unr',o=>o.fir).slice(0,12), 'unr', '#6c8fb3', fm, fir))}
    ${sec('Ação orçamentária', 'valor firmado', hbar(agrupar(L,'acao',o=>o.fir).slice(0,10), 'acao', '#b7860b', fm, fir))}
    ${sec('Resultado primário', 'valor firmado', hbar(agrupar(L,'rpN',o=>o.fir), 'rpN', '#8e6bbf', fm, fir))}
    ${TES.carregado ? sec('Origem do TED', 'Tesouro Gerencial × API do Transferegov · quantidade', hbar(agrupar(L,'org'), 'org', k => /diferentes/.test(k)?'#c0392b':/Só no Tesouro/.test(k)?'#16a085':/Só na API|sem nº/.test(k)?'#b7860b':'#2e8a57', null, L.length)) : ''}
  </div>`;
}
function render(){
  desenharFiltros();
  const L = filtrar();
  document.getElementById('contagem').textContent = `${n(L.length)} planos de ação no recorte`;
  document.getElementById('corpo').innerHTML = telaTED(L);
  const q = document.getElementById('busca').value.trim().toUpperCase();
  const lista = (q ? L.filter(o => [o.n,o.cod,o.unr,o.orr,o.obj,o.sei,o.ugr,o.prog].join(' ').toUpperCase().includes(q)) : L).slice()
    .sort((a,b) => FASES.indexOf(a.fase)-FASES.indexOf(b.fase) || (a.dias??1e9)-(b.dias??1e9));
  const cols = [['TED',tedId],['Unidade descentralizada',unid],['Fase',o=>faseTag(o)+`<small>${esc(o.stN)}</small>`],['Firmado',o=>fm(o.fir),'n'],
    ['Descentralizado',o=>fm(o.nc)+(o.op>1?`<small style="color:#b7860b">pendente ${fm(o.op)}</small>`:''),'n'],['Repassado',o=>fm(o.pf)+(o.ar>1?`<small style="color:#b7860b">a repassar ${fm(o.ar)}</small>`:''),'n'],
    ['Fim vigência',o=>(esc(o.fim)||'—')+`<small>${o.dias===null?'':o.dias<0?'vencida':'faltam '+o.dias+' d'}</small>`,'n']];
  document.getElementById('lista').innerHTML = tabela('l', lista, cols, 15);
}
